[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatpump-calculator"
version = "0.1.0"
description = "Kalkulator i symulator jednostopniowego obiegu pompy ciepła (TESPy, SciPy, CoolProp, Streamlit)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tespy>=0.7.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "CoolProp>=6.6.0",
    "fluprodia>=3.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
